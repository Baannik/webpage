<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV – Barbara Annicchiarico</title>
  <meta name="description" content="CV – Barbara Annicchiarico">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --maroon: #2e0112; --maroon-light: #5a0a2a; --accent: #9b2248;
      --bg: #f7f3f1; --surface: #ffffff; --text: #1a1a1a;
      --muted: #6b5c5c; --border: #e0d4d0;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Source Sans 3', sans-serif; font-weight: 300; background: var(--bg); color: var(--text); line-height: 1.7; }
    header { background: var(--maroon); padding: 2rem 3rem; }
    header h1 { font-family: 'Playfair Display', serif; font-size: 1.7rem; font-weight: 400; color: #fff; letter-spacing: 0.02em; }
    nav { background: var(--surface); border-bottom: 2px solid var(--border); padding: 0 3rem; position: sticky; top: 0; z-index: 10; }
    nav ul { list-style: none; display: flex; gap: 0; }
    nav ul li a { display: block; padding: 1rem 1.4rem; text-decoration: none; color: var(--muted); font-size: 0.9rem; font-weight: 400; letter-spacing: 0.06em; text-transform: uppercase; border-bottom: 3px solid transparent; transition: color 0.2s, border-color 0.2s; }
    nav ul li a:hover, nav ul li a.active { color: var(--maroon); border-bottom-color: var(--accent); }
    main { max-width: 760px; margin: 3rem auto; padding: 0 2rem; }
    h2 { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--maroon); margin-bottom: 2rem; padding-bottom: 0.5rem; border-bottom: 2px solid var(--border); }
    .cv-links { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 2.5rem; }
    .cv-btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.5rem; background: var(--maroon); color: #fff; text-decoration: none; font-size: 0.9rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; border-radius: 3px; transition: background 0.2s; }
    .cv-btn:hover { background: var(--accent); }
    .cv-btn svg { width: 16px; height: 16px; fill: currentColor; }
    .bio { font-style: italic; color: var(--muted); font-size: 1.05rem; padding: 1.25rem 1.5rem; border-left: 4px solid var(--accent); background: #fff; border-radius: 0 4px 4px 0; }
    footer { background: var(--maroon); color: rgba(255,255,255,0.6); text-align: center; padding: 1.25rem; font-size: 0.8rem; margin-top: 4rem; }
    @media (max-width: 680px) { header { padding: 1.5rem; } nav { padding: 0 1rem; } main { margin: 2rem auto; } }
  </style>
</head>

        CV (English)

      <a class="cv-btn" href="Annicchiarico_CV_ITA.pdf" target="_blank">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm-1 1.5L18.5 9H13V3.5zM6 20V4h5v7h7v9H6z"/></svg>
        CV (italiano)
      </a>
    </div>
    <p class="bio">I am a Sicily-born Apulian living in the Urbe.</p>

</body>
